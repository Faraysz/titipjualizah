      <stop offset="0%" stop-color="#fff7f4"/>
      <stop offset="100%" stop-color="#fff0f3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="560" rx="20" fill="none" stroke="#fecdd6" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="300" cy="270" r="140" fill="#ffffff" stroke="#fecdd6" stroke-width="2"/>
  
