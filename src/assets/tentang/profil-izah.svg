<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7f4"/>
      <stop offset="100%" stop-color="#fff0f3"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg)" rx="32"/>
  <rect x="20" y="20" width="460" height="460" rx="24" fill="none" stroke="#fecdd6" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="250" cy="220" r="110" fill="#ffffff" stroke="#fecdd6" stroke-width="2"/>
  
  <!-- Profile Silhouette / Avatar minimal -->
  <g transform="translate(190, 160)" stroke="#be123c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="60" cy="40" r="25" fill="#fff0f3"/>
    <path d="M 20 110 C 20 80, 40 70, 60 70 C 80 70, 100 80, 100 110" fill="#fff0f3"/>
  </g>

  <text x="250" y="380" font-family="'Playfair Display', serif" font-size="20" font-weight="700" fill="#292524" text-anchor="middle">Kak Izah</text>
  <text x="250" y="410" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#e11d48" text-anchor="middle">[GANTI: Foto Profil Kak Izah]</text>
  <text x="250" y="435" font-family="'Poppins', sans-serif" font-size="11" fill="#78716c" text-anchor="middle">Rasio 1:1 (500 x 500 px)</text>
</svg>

