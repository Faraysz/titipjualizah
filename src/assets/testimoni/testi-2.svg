<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#292524" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="500" height="700" fill="#fff7f4" rx="28"/>

  <g transform="translate(40, 40)" filter="url(#phoneShadow)">
    <rect width="420" height="620" rx="36" fill="#ffffff" stroke="#e7e5e4" stroke-width="3"/>
    <rect x="170" y="16" width="80" height="6" rx="3" fill="#d6d3d1"/>

    <!-- WhatsApp Header -->
    <rect x="3" y="38" width="414" height="64" fill="#075e54"/>
    <circle cx="45" cy="70" r="18" fill="#25d366"/>
    <text x="45" y="75" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">KI</text>
    <text x="75" y="66" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Kak Izah (Titip Jual)</text>
    <text x="75" y="82" font-family="'Poppins', sans-serif" font-size="11" fill="#bbf7d0">Online</text>

    <!-- Chat Area -->
    <rect x="3" y="102" width="414" height="515" fill="#ece5dd" rx="0 0 33 33"/>

    <!-- Outgoing message (Customer / Seller) -->
    <g transform="translate(90, 140)">
      <rect width="310" height="90" rx="12" fill="#dcf8c6"/>
      <text x="14" y="24" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Kak Izah, 5 pcs blazer &amp; dress aku</text>
      <text x="14" y="42" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">beneran udah sold out semua yaa? 😭</text>
      <text x="14" y="60" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Cepet bangeet gak sampe seminggu!</text>
      <text x="278" y="80" font-family="'Poppins', sans-serif" font-size="9" fill="#78716c">10:05 ✓✓</text>
    </g>

    <!-- Incoming message (Kak Izah) -->
    <g transform="translate(20, 250)">
      <rect width="290" height="90" rx="12" fill="#ffffff"/>
      <text x="14" y="24" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Iya Kak Siti, alhamdulillah pembeli borong</text>
      <text x="14" y="42" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">karena kondisinya emang bagus banget.</text>
      <text x="14" y="60" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Uang hasil penjualan udh ditransfer ya kak.</text>
      <text x="258" y="80" font-family="'Poppins', sans-serif" font-size="9" fill="#78716c">10:12</text>
    </g>

    <rect x="40" y="480" width="340" height="50" rx="12" fill="#e11d48"/>
    <text x="210" y="504" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">[GANTI: Screenshot Chat WhatsApp Asli]</text>
    <text x="210" y="521" font-family="'Poppins', sans-serif" font-size="10" fill="#ffe4e6" text-anchor="middle">Rasio 3:4 atau screenshot portrait HP</text>
  </g>
</svg>

