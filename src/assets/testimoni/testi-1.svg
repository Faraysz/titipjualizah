<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#292524" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="500" height="700" fill="#fff7f4" rx="28"/>

  <!-- Phone frame -->
  <g transform="translate(40, 40)" filter="url(#phoneShadow)">
    <rect width="420" height="620" rx="36" fill="#ffffff" stroke="#e7e5e4" stroke-width="3"/>
    
    <!-- Phone speaker & camera notch -->
    <rect x="170" y="16" width="80" height="6" rx="3" fill="#d6d3d1"/>

    <!-- WhatsApp Header -->
    <rect x="3" y="38" width="414" height="64" fill="#075e54"/>
    <circle cx="45" cy="70" r="18" fill="#25d366"/>
    <text x="45" y="75" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">KI</text>
    <text x="75" y="66" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Kak Izah (Titip Jual)</text>
    <text x="75" y="82" font-family="'Poppins', sans-serif" font-size="11" fill="#bbf7d0">Online</text>

    <!-- Chat Area Background -->
    <rect x="3" y="102" width="414" height="515" fill="#ece5dd" rx="0 0 33 33"/>

    <!-- Incoming message (Kak Izah) -->
    <g transform="translate(20, 130)">
      <rect width="280" height="60" rx="12" fill="#ffffff"/>
      <text x="14" y="24" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Halo Kak Nadia! Tas Coach-nya</text>
      <text x="14" y="42" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">sudah DEAL dan dibayar pembeli ya ✨</text>
      <text x="250" y="52" font-family="'Poppins', sans-serif" font-size="9" fill="#78716c">14:15</text>
    </g>

    <!-- Outgoing message (Customer / Seller) -->
    <g transform="translate(110, 210)">
      <rect width="290" height="95" rx="12" fill="#dcf8c6"/>
      <text x="14" y="24" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Wah alhamdulillah cepet bgt Kak Izah! 😍</text>
      <text x="14" y="42" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Padahal di lemari udah setahun gak kepake.</text>
      <text x="14" y="60" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Makasih banyak ya kak, ditunggu transfernya~</text>
      <text x="258" y="85" font-family="'Poppins', sans-serif" font-size="9" fill="#78716c">14:18 ✓✓</text>
    </g>

    <!-- Transfer Proof simulation -->
    <g transform="translate(20, 325)">
      <rect width="290" height="110" rx="12" fill="#ffffff"/>
      <rect x="12" y="12" width="266" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="24" y="32" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#15803d">TRANSFER BERHASIL: Rp 1.450.000</text>
      <text x="24" y="46" font-family="'Poppins', sans-serif" font-size="10" fill="#166534">BCA - Rekening Kak Nadia</text>
      <text x="14" y="74" font-family="'Poppins', sans-serif" font-size="11" fill="#292524">Dana sudah masuk rekening ya kak!</text>
      <text x="258" y="100" font-family="'Poppins', sans-serif" font-size="9" fill="#78716c">14:30</text>
    </g>

    <!-- Placeholder Badge Overlay -->
    <rect x="40" y="480" width="340" height="50" rx="12" fill="#e11d48"/>
    <text x="210" y="504" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">[GANTI: Screenshot Chat WhatsApp Asli]</text>
    <text x="210" y="521" font-family="'Poppins', sans-serif" font-size="10" fill="#ffe4e6" text-anchor="middle">Rasio 3:4 atau screenshot portrait HP</text>
  </g>
</svg>

